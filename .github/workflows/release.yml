name: Release
on:
  push: { tags: ["v*"] }
permissions: { contents: read }
jobs:
  release:
    runs-on: ubuntu-latest
    permissions: { contents: write, id-token: write, attestations: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Tag matches package version
        run: test "v$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')" = "$GITHUB_REF_NAME"
      - run: python -m unittest discover -s tests
      - run: python -m pip install build && python -m build
      - name: Build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with: { subject-path: "dist/*" }
      - name: GitHub release
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
        env: { GH_TOKEN: "${{ github.token }}" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: dist, path: dist/ }
  pypi:
    # Turn on after adding a trusted (pending) publisher on pypi.org for this repo, workflow release.yml, environment pypi (repo variable PYPI_PUBLISH=true).
    if: vars.PYPI_PUBLISH == 'true'
    needs: release
    runs-on: ubuntu-latest
    environment: pypi
    permissions: { id-token: write }
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: dist, path: dist/ }
      - name: Publish to PyPI (trusted publishing, PEP 740 attestations)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1

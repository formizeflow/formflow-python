[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "formizeflow"
version = "0.1.0"
description = "Small typed client for the FormFlow REST API (standard library only)"
requires-python = ">=3.9"
dependencies = []
readme = "README.md"
license = { text = "MIT" }
classifiers = ["License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Typing :: Typed"]

[project.urls]
Homepage = "https://github.com/formizeflow/formflow-python"
Source = "https://github.com/formizeflow/formflow-python"

[tool.setuptools.packages.find]
include = ["formflow*"]

[tool.setuptools.package-data]
formflow = ["py.typed"]
